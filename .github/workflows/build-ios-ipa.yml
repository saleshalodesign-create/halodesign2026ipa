name: Build iOS IPA (Unsigned for Sideload / Xcode)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Setup Capacitor iOS project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS .app with Xcode
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            SYMROOT="$PWD/build-ios"

      - name: Package HaloDesignHub-unsigned.ipa
        run: |
          mkdir -p Payload
          cp -R build-ios/Release-iphoneos/App.app Payload/App.app
          zip -r -y HaloDesignHub-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloDesignHub-unsigned-ipa
          path: HaloDesignHub-unsigned.ipa
