name: Build iOS IPA (Unsigned for Sideload / Xcode)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npx vite build

      - name: Setup Capacitor iOS project
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios
          if [ -f "ios/App/Podfile" ] && [ ! -d "ios/App/Pods" ]; then
            cd ios/App && pod install
          fi

      - name: Build unsigned iOS .app with Xcode
        run: |
          if [ -d "ios/App/App.xcworkspace" ] && [ -f "ios/App/Podfile" ]; then
            xcodebuild \
              -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build-ios" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          else
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$PWD/build-ios" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          fi

      - name: Package HaloDesignHub-unsigned.ipa
        run: |
          APP_PATH=$(find build-ios -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -r -y HaloDesignHub-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaloDesignHub-unsigned-ipa
          path: HaloDesignHub-unsigned.ipa
